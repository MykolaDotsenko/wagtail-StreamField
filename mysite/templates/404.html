{% extends "base.html" %}

{% block title %}Page not found{% endblock %}
{% block body_class %}template-404{% endblock %}

{% block content %}
<section class="empty-state empty-state--centered" aria-labelledby="not-found-title">
    <div class="empty-state__icon" aria-hidden="true">404</div>
    <div>
        <h1 id="not-found-title">This page isn’t here</h1>
        <p>The address may have changed. Return to Today or search DomoNest instead.</p>
    </div>
    <div class="cluster">
        <a class="button button--primary" href="/">Go to Today</a>
        <a class="button button--secondary" href="{% url 'search' %}">Search</a>
    </div>
</section>
{% endblock %}
