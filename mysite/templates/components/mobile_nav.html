<nav class="mobile-nav" aria-label="Primary">
    <div class="mobile-nav__inner">
        <a class="mobile-nav__item"{% if request.path == "/" %} aria-current="page"{% endif %} href="/">
            <span class="mobile-nav__icon" aria-hidden="true">●</span>
            <span>Today</span>
        </a>

        <a class="mobile-nav__item"{% if request.resolver_match.url_name == "search" %} aria-current="page"{% endif %} href="{% url 'search' %}">
            <span class="mobile-nav__icon" aria-hidden="true">⌕</span>
            <span>Discover</span>
        </a>

        {% if request.user.is_authenticated %}
            <form class="mobile-nav__form" action="{% url 'logout' %}" method="post">
                {% csrf_token %}
                <button class="mobile-nav__item mobile-nav__button" type="submit">
                    <span class="mobile-nav__icon" aria-hidden="true">↗</span>
                    <span>Sign out</span>
                </button>
            </form>
        {% else %}
            <a class="mobile-nav__item"{% if request.resolver_match.url_name == "login" %} aria-current="page"{% endif %} href="{% url 'login' %}">
                <span class="mobile-nav__icon" aria-hidden="true">○</span>
                <span>Sign in</span>
            </a>
        {% endif %}
    </div>
</nav>
