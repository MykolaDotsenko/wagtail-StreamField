<nav class="mobile-nav" aria-label="Primary">
    <div class="mobile-nav__inner">
        {% if request.user.is_authenticated %}
            <a class="mobile-nav__item"{% if request.resolver_match.namespace == "household" and request.resolver_match.url_name == "today" %} aria-current="page"{% endif %} href="{% url 'household:today' %}">
                <span class="mobile-nav__icon" aria-hidden="true">●</span>
                <span>Today</span>
            </a>
            <a class="mobile-nav__item"{% if request.resolver_match.namespace == "household" and request.resolver_match.url_name == "plan" %} aria-current="page"{% endif %} href="{% url 'household:plan' %}">
                <span class="mobile-nav__icon" aria-hidden="true">▦</span>
                <span>Plan</span>
            </a>
        {% else %}
            <a class="mobile-nav__item"{% if request.path == "/" %} aria-current="page"{% endif %} href="/">
                <span class="mobile-nav__icon" aria-hidden="true">●</span>
                <span>Today</span>
            </a>
        {% endif %}

        {% if request.user.is_authenticated %}
            <a class="mobile-nav__item"{% if request.resolver_match.namespace == "household" and request.resolver_match.url_name == "shopping" %} aria-current="page"{% endif %} href="{% url 'household:shopping' %}">
                <span class="mobile-nav__icon" aria-hidden="true">✓</span>
                <span>Shop</span>
            </a>
            <a class="mobile-nav__item"{% if request.resolver_match.namespace == "household" and request.resolver_match.url_name == "pantry" %} aria-current="page"{% endif %} href="{% url 'household:pantry' %}">
                <span class="mobile-nav__icon" aria-hidden="true">◌</span>
                <span>Pantry</span>
            </a>
            <a class="mobile-nav__item"{% if request.resolver_match.namespace == "household" and request.resolver_match.url_name == "routines" %} aria-current="page"{% endif %} href="{% url 'household:routines' %}">
                <span class="mobile-nav__icon" aria-hidden="true">↻</span>
                <span>Rhythm</span>
            </a>
        {% endif %}

        <a class="mobile-nav__item"{% if request.resolver_match.url_name == "search" %} aria-current="page"{% endif %} href="{% url 'search' %}">
            <span class="mobile-nav__icon" aria-hidden="true">⌕</span>
            <span>Learn</span>
        </a>

        {% if not request.user.is_authenticated %}
            <a class="mobile-nav__item"{% if request.resolver_match.url_name == "login" %} aria-current="page"{% endif %} href="{% url 'login' %}">
