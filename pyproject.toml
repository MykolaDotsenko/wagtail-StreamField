[project]
name = "domonest"
version = "1.0.0"
description = "A modern household organizer and Wagtail CMS case study."
authors = [{ name = "Mykola Dotsenko" }]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "Django==5.2.17",
    "wagtail==7.4.3",
    "gunicorn==23.0.0",
    "whitenoise==6.9.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "DJ"]

[tool.ruff.lint.per-file-ignores]
"mysite/settings/*.py" = ["F403", "F405"]

[tool.coverage.run]
branch = true
source = ["blog", "home", "planner", "search"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
