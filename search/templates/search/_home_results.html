<ul class="discover-results discover-results--private">
    {% for result in results %}
        <li class="discover-result discover-result--private">
            <a class="discover-result__link" href="{{ result.href }}">
                <span class="discover-result__body">
                    <span class="cluster discover-result__meta">
                        <span class="status-badge status-badge--calm">Private</span>
                        <span>{{ result.kind }}</span>
                    </span>
                    <strong class="discover-result__title">{{ result.title }}</strong>
                    <span class="discover-result__summary">{{ result.detail }}</span>
                </span>
                <span class="item-row__arrow" aria-hidden="true">→</span>
            </a>
        </li>
    {% endfor %}
</ul>
