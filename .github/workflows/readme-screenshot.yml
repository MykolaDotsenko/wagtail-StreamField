name: Capture README screenshot

on:
  push:
    branches:
      - docs/readme-visual-refresh

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: docs/readme-visual-refresh

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install browser dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Build deterministic demo
        run: |
          python manage.py migrate --noinput
          python manage.py seed_demo --reset --username demo --password domonest-demo

      - name: Start Django
        run: |
          python manage.py runserver 127.0.0.1:8000 --noreload > /tmp/domonest.log 2>&1 &
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8000/health/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/domonest.log
          exit 1

      - name: Capture exact README screenshot
        run: node scripts/capture-readme-screenshot.mjs

      - name: Commit screenshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/domonest-today.png
          git diff --cached --quiet && exit 0
          git commit -m "Add exact DomoNest interface screenshot"
          git push
