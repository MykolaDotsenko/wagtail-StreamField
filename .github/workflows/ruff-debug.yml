name: Ruff debug

on:
  push:
    branches:
      - fix/pr3-ruff-imports

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Show Ruff canonical diff
        run: ruff check household/services.py --fix --diff || true
